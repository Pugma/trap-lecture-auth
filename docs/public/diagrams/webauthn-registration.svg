<title id="title">WebAuthn の登録</title>
<desc id="desc">認証済みの利用者が、サービスへ新しい資格情報を結び付ける例。ブラウザやサービスは認証器の秘密鍵・PIN・生体情報を受け取りません。開始状態と資格情報の保存は、失敗時・並行時にも整合させます。</desc>
